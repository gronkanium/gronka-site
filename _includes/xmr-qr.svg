{%- comment -%}
  QR code for site.monero_address, encoded as a version-5 byte-mode QR with a 4-module
  quiet zone. Dark modules on white on purpose: plenty of scanners refuse an inverted
  code, so this stays light even though the surrounding page is dark.

  Not generated at build time -- if the address in _config.yml changes, regenerate with
  any encoder (e.g. `segno.make(addr).save('qr.svg', scale=1)`) and re-verify by
  scanning the result before shipping it.
{%- endcomment -%}
