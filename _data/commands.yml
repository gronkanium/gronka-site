- name: convert
  type: slash
  description: convert a video (max 100mb) or image (max 50mb) to gif
  usage: '/convert [file|url] [quality] [optimize] [lossy] [start_time] [end_time]'
  examples:
    - '/convert file:<attachment>'
    - '/convert url:https://example.com/video.mp4'
    - '/convert url:https://example.com/video.mp4 start_time:30 end_time:60'
    - '/convert file:<attachment> quality:high optimize:true lossy:50'
  context_menu: true
  context_menu_name: convert to gif
  context_menu_advanced: true
  options:
    - name: file
      type: attachment
      description: the video (max 100mb) or image (max 50mb) file to convert
      required: false
    - name: url
      type: string
      description: url to a video or image file to convert
      required: false
    - name: quality
      type: string
      description: 'gif quality preset (low, medium, high). default: medium'
      required: false
      choices: [low, medium, high]
    - name: optimize
      type: boolean
      description: optimize the gif after conversion to reduce file size
      required: false
    - name: lossy
      type: number
      description: 'lossy compression (0-100, default: 35). higher = more compression, lower quality'
      required: false
      min: 0
      max: 100
    - name: start_time
      type: number
      description: start time in seconds for trimming (videos only, ignored for images)
      required: false
      min: 0
    - name: end_time
      type: number
      description: end time in seconds for trimming (videos only, ignored for images)
      required: false
      min: 0
  supported_formats:
    video: [mp4, mov, webm, avi, mkv]
    image: [png, jpg, jpeg, webp, gif]

- name: optimize
  type: slash
  description: optimize a gif file (max 50mb) to reduce its size
  usage: '/optimize [file|url] [lossy]'
  examples:
    - '/optimize file:<attachment>'
    - '/optimize url:https://example.com/gif.gif lossy:50'
  context_menu: true
  context_menu_name: optimize
  options:
    - name: file
      type: attachment
      description: the gif file to optimize (max 50mb)
      required: false
    - name: url
      type: string
      description: url to a gif file to optimize (max 50mb)
      required: false
    - name: lossy
      type: number
      description: 'lossy compression level (0-100, default: 35). higher = more compression, lower quality'
      required: false
      min: 0
      max: 100
  lossy_ranges:
    - range: '0-30'
      description: less compression, higher quality, larger files
    - range: '30-60'
      description: balanced compression and quality
    - range: '60-100'
      description: more compression, lower quality, smaller files

- name: download
  type: slash
  description: download a video or image from 20+ platforms (cobalt + yt-dlp), each source individually toggleable from the dashboard
  usage: '/download url:<url> [start_time] [end_time]'
  examples:
    - '/download url:https://twitter.com/example/status/123'
    - '/download url:https://reddit.com/r/example/comments/abc'
    - '/download url:https://youtube.com/watch?v=example start_time:30 end_time:60'
  context_menu: true
  context_menu_name: download
  options:
    - name: url
      type: string
      description: url to a video or image to download
      required: true
    - name: start_time
      type: number
      description: start time in seconds for trimming the downloaded video
      required: false
      min: 0
    - name: end_time
      type: number
      description: end time in seconds for trimming the downloaded video
      required: false
      min: 0

- name: info
  type: slash
  description: view bot statistics, system information, and gif storage/cache usage
  usage: '/info'
  examples:
    - '/info'
  context_menu: false
