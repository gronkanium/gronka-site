title: gronka
tagline: discord bot for downloading media and making gifs
description: gronka is a free, open-source discord bot that converts videos and images to gifs and downloads media from 20+ platforms — twitter/x, tiktok, instagram, youtube, reddit, and more
url: https://gronka.dev
baseurl: ""
lang: en
author: thedorekaczynski
twitter:
  username: ""  # Add your Twitter username here (e.g., "username" without @)
  card: summary_large_image

# SEO plugin configuration
title_separator: ""

# Open Graph and social sharing image
# Use a static image URL for better caching and SEO
# Recommended size: 1200x630px for Open Graph
image: /assets/og-image.png

# Additional SEO metadata
keywords: "discord, bot, gif, video, converter, social media, download, media, conversion"

# analytics / ads / heatmaps (production only; blank = disabled)
# see _includes/tracking.html
gtm_id: "GTM-PNKLQBTV"  # container for pixels, conversions
ga4_id: "G-PQX32Q8VMQ"  # Google Analytics 4 — visitor stats
clarity_id: "xp6mutexk8"          # Microsoft Clarity heatmaps
adsense_id: "ca-pub-4600565639002892"  # AdSense auto ads

# build settings
markdown: kramdown
theme: minima
sass:
  sourcemap: never
  style: compressed
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap


# include cloudflare pages configuration files
include:
  - _headers
  - _redirects

# exclude
exclude:
  - node_modules
  - logs
  - README.md
  - package.json
  - package-lock.json
  - .git
  - .gitignore

