title: gronka
tagline: discord bot for downloading media and making gifs
description: gronka is a free, open-source discord bot that converts videos and images to gifs and downloads media from 20+ platforms — twitter/x, tiktok, instagram, youtube, reddit, and more
url: https://gronka.dev
baseurl: ""
lang: en
author: thedorekaczynski
twitter:
  username: ""  # Add your Twitter username here (e.g., "username" without @)
  card: summary_large_image

# SEO plugin configuration
title_separator: ""

# Open Graph and social sharing image
# Use a static image URL for better caching and SEO
# width/height are required so link-preview clients (iMessage, Discord, etc.) know the
# aspect ratio up front instead of guessing and center-cropping to a square, which was
# cutting off the left/right edges of the text in the image.
image:
  path: /assets/og-image.png
  width: 1200
  height: 630
  alt: "gronka — downloads social media, makes gifs"

# Additional SEO metadata
keywords: "discord, bot, gif, video, converter, social media, download, media, conversion"

# Single source of truth for the invite link. GTM triggers match on "Click URL contains
# discord.com/oauth2/authorize", so this string must not change shape.
discord_invite: "https://discord.com/oauth2/authorize?client_id=1522194017692156046"

# analytics / ads / heatmaps (production only; blank = disabled)
# see _includes/tracking.html
gtm_id: "GTM-PNKLQBTV"  # container for pixels, conversions
ga4_id: "G-PQX32Q8VMQ"  # Google Analytics 4 — visitor stats
clarity_id: "xp6mutexk8"          # Microsoft Clarity heatmaps
adsense_id: "ca-pub-4600565639002892"  # AdSense auto ads

# build settings
markdown: kramdown
theme: minima
sass:
  sourcemap: never
  style: compressed
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap


# include cloudflare pages configuration files
include:
  - _headers
  - _redirects

# exclude
exclude:
  - node_modules
  - logs
  - README.md
  - package.json
  - package-lock.json
  - .git
  - .gitignore
  # Cloudflare compiles Pages Functions from the repo root, not from the build
  # output, so copying this into _site would only publish the source.
  - functions
  # Local-only AI instructions (gitignored, so Cloudflare never sees it) -- excluded
  # as well so it cannot be published by a direct upload of a local _site.
  - CLAUDE.md
  - .claude

