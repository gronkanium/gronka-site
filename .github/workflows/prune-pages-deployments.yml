name: Prune old Cloudflare Pages deployments

# ponytail: runs on a delay (not on push) so it never races Cloudflare's own
# build for the commit that just landed — deleting a deployment that's still
# being promoted to production would be bad. If deploys ever get slower than
# 10 min, bump the sleep below.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# ponytail: a rapid run of pushes each queue their own 10-min-delayed run;
# without this, they'd stack up and all fire independently. Since the job
# always converges on "keep whatever's newest right now" anyway, only the
# most recently queued run needs to survive — cancel any older, still-
# sleeping run for the same ref the moment a newer push comes in.
concurrency:
  group: prune-pages-deployments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages build to finish promoting
        if: github.event_name == 'push'
        run: sleep 600

      - name: Keep only the current production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 354e5da1a11298aba9593be4b08f795d
        run: |
          # ponytail: wrangler's raw output is a wide ASCII table with
          # dashboard URLs per row -- noisy in a CI log. Suppress it and
          # print only what changed.
          list_ids() {
            npx --yes wrangler pages deployment list --project-name=gronka 2>/dev/null \
              | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'
          }

          KEEP=$(list_ids | head -1)
          echo "Keeping current deployment: $KEEP"

          deleted=0
          for round in $(seq 1 15); do
            ids=$(list_ids | grep -v "$KEEP" | sort -u)
            [ -z "$ids" ] && break
            for id in $ids; do
              if npx --yes wrangler pages deployment delete "$id" --project-name=gronka --force >/dev/null 2>&1; then
                deleted=$((deleted + 1))
                echo "Deleted: $id"
              else
                echo "Failed to delete: $id"
              fi
            done
          done

          echo "Done -- pruned $deleted old deployment(s)."
